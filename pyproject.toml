[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pweh"
version = "0.1.0"
description = "PWEH (Play With Every Hardware) - 에이전트 주도 임베디드 기기 하드웨어 분석 파이프라인 (MCP + Skills)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pweh contributors" }]
dependencies = [
    "mcp>=2.3,<3",
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pweh = "pweh.cli:main"
pweh-case-mcp = "case_mcp.server:main"
pweh-uart-mcp = "uart_mcp.server:main"
pweh-openocd-mcp = "openocd_mcp.server:main"
pweh-sigrok-mcp = "sigrok_mcp.server:main"
pweh-jtagulator-mcp = "jtagulator_mcp.server:main"
pweh-fwtriage-mcp = "fwtriage_mcp.server:main"
pweh-esp-mcp = "esp_mcp.server:main"
pweh-forensics-mcp = "forensics_mcp.server:main"
pweh-emu-mcp = "emu_mcp.server:main"
pweh-mock-device = "pweh.mocktarget.cli:main"

[tool.setuptools]
# 공통 코어(pweh)는 src/ 아래, 각 MCP 서버 패키지는 명세의 디렉터리 구조대로 mcp-servers/<name>/ 아래에 둔다.
package-dir = { "" = "src", "case_mcp" = "mcp-servers/case-mcp/case_mcp", "uart_mcp" = "mcp-servers/uart-mcp/uart_mcp", "openocd_mcp" = "mcp-servers/openocd-mcp/openocd_mcp", "sigrok_mcp" = "mcp-servers/sigrok-mcp/sigrok_mcp", "jtagulator_mcp" = "mcp-servers/jtagulator-mcp/jtagulator_mcp", "fwtriage_mcp" = "mcp-servers/fwtriage-mcp/fwtriage_mcp", "esp_mcp" = "mcp-servers/esp-mcp/esp_mcp", "forensics_mcp" = "mcp-servers/forensics-mcp/forensics_mcp", "emu_mcp" = "mcp-servers/emu-mcp/emu_mcp" }
packages = [
    "pweh",
    "pweh.safety",
    "pweh.schemas",
    "pweh.mocktarget",
    "pweh.data",
    "pweh.fs",
    "case_mcp",
    "uart_mcp",
    "openocd_mcp",
    "sigrok_mcp",
    "jtagulator_mcp",
    "fwtriage_mcp",
    "esp_mcp",
    "forensics_mcp",
    "emu_mcp",
]

[tool.setuptools.package-data]
"pweh.schemas" = ["*.json"]
"pweh.data" = ["*.yaml", "*.json", "*.txt"]
"pweh.mocktarget" = ["profiles/*.yaml", "*.yaml", "firmware_src/*.c", "firmware_src/*.h", "profiles/vendor_src/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: 실제 하드웨어가 연결되어 있어야 하는 테스트 (기본 skip)",
    "external: 외부 도구(sigrok-cli, openocd, binwalk, unblob, ghidra, esptool 등)가 필요한 테스트 (없으면 skip)",
    "slow: 오래 걸리는 테스트",
]
filterwarnings = [
    "ignore::DeprecationWarning:jsonschema.*",
]
