# pweh.mocktarget 시뮬레이터 프로필 — HiSilicon V4 계열 "유사" 카메라 (합성 데이터)
#
# 실제 벤더 펌웨어/코드가 아니다. 출력 "형식"은 HiSilicon V4 SDK 의 베이스인 U-Boot 2016.11 포크와
# Linux 4.9, BusyBox 소스에서 확인한 코드 경로를 따르고, 값(날짜·주소·문구)은 합성한 것이다.
# 근거: ~/pweh-refs/openipc/u-boot-hi3516ev200 (cmd/sf.c, cmd/bdinfo.c, common/cli_hush.c,
#       common/autoboot.c, common/hash.c, configs/hi3516ev300_defconfig), docs/references/uboot-and-boot-console.md
name: hisilicon-like
description: >-
  HiSilicon Hi3516EV300 유사 ARM Cortex-A7 IP 카메라 (U-Boot 2016.11 SDK 포크, hush 파서,
  Linux 4.9.37, BusyBox 1.26.2, 16MiB SPI NOR). 합성 데이터.
aliases: [mock-hisilicon, hisilicon]
pipeline_profile: mock-hisilicon
arch: arm
endianness: little
baud: 115200

flash:
  type: spi-nor
  model: "W25Q128(B/F)V"
  jedec_id: [0xef, 0x40, 0x18]
  size: 16MiB
  page_size: 256
  erase_size: 64KiB
  mtdparts: "hi_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(app)"
  # FMC 메모리 매핑 읽기 창 (md 로 플래시를 직접 볼 수 있음, 쓰기 불가)
  memory_window: 0x14000000

dram:
  base: 0x40000000
  size: 64MiB

uart:
  rx_fifo: 32            # PL011 RX FIFO
  linux_rx_buffer: 4096  # N_TTY_BUF_SIZE

uboot:
  dialect: hisilicon-2016
  version: "U-Boot 2016.11 (Mar 23 2020 - 14:58:03 +0800)"
  version_tag: "hi3516ev300"
  prompt: "hisilicon # "
  hush_ps2: "> "
  maxargs: 32
  cbsize: 1024
  loadaddr: 0x42000000
  text_base: 0x40800000
  cc_version: "arm-himix100-linux-gcc (HC&C V100R002C00B027_20200302) 6.3.0"
  ld_version: "GNU ld (GNU Binutils) 2.26.20160125"
  autoboot:
    delay: 2
    keys: null           # null = 아무 키 (CONFIG_AUTOBOOT_KEYED is not set)
    zero_check: true
  bdinfo:
    arch_number: 0x00000000
    boot_params: 0x40000100
    tlb_addr: 0x43ff0000
    relocaddr: 0x43f9e000
    reloc_off: 0x0379e000
    irq_sp: 0x43f5dee0
    sp_start: 0x43f5ded0
    early_malloc: "1a8 / 2000"
  env:
    arch: arm
    baudrate: "115200"
    board: hi3516ev300
    board_name: hi3516ev300
    bootargs: "mem=40M console=ttyAMA0,115200 root=/dev/mtdblock3 rootfstype=squashfs init=linuxrc mtdparts=hi_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(app)"
    bootcmd: "sf probe 0; sf read 0x42000000 0x50000 0x200000; bootm 0x42000000"
    bootdelay: "2"
    bootfile: uImage
    cpu: armv7
    ethaddr: "00:00:23:34:45:66"
    ipaddr: 192.168.1.10
    netmask: 255.255.255.0
    serverip: 192.168.1.2
    soc: hi3516ev300
    vendor: hisilicon
    verify: "n"
  # CRC 가 깨졌을 때 쓰는 컴파일 시점 기본 env (CONFIG_BOOTCOMMAND/CONFIG_BOOTARGS 등)
  default_env:
    arch: arm
    baudrate: "115200"
    board: hi3516ev300
    board_name: hi3516ev300
    bootargs: "mem=40M console=ttyAMA0,115200"
    bootcmd: "bootm 0x42000000"
    bootdelay: "2"
    bootfile: uImage
    cpu: armv7
    ethaddr: "00:00:23:34:45:66"
    ipaddr: 192.168.1.10
    netmask: 255.255.255.0
    serverip: 192.168.1.2
    soc: hi3516ev300
    vendor: hisilicon
  runtime_env:
    stdin: serial
    stdout: serial
    stderr: serial
  commands: ["?", base, bdinfo, boot, bootd, bootm, cmp, coninfo, cp, crc32, echo, env, "false", go, help,
             iminfo, loop, md, mm, mtest, mw, nm, ping, printenv, reset, run, saveenv, setenv, sf, sleep,
             test, tftpboot, "true", version]
  net:
    eth_name: eth0
    # 합성: 링크가 없는 상태의 드라이버 메시지 (SIMULATED)
    link_down:
      - "eth0 : phy status change : LINK=DOWN : DUPLEX=FULL : SPEED=100M"
  timings:
    bootrom: 0.25
    banner_line: 0.004
    relocate: 0.05
    flash_read_bps: 12000000
    flash_erase_block: 0.03
    flash_program_bps: 400000
    kernel_line: 0.012
    userspace: 0.6
  banner: |


    System startup

    Uncompress Ok!

    {version}{version_tag}

    DRAM:  64 MiB
    Relocation Offset is: 0379e000
    Relocating to 43f9e000, new gd at 43f5dee0, sp at 43f5ded0
    SPI Nor:  Check Flash Memory Controller v100 ... Found
    SPI Nor ID Table Version 1.0
    SPI Nor(cs 0) ID: 0xef 0x40 0x18
    Block:64KB Chip:16MB Name:"W25Q128(B/F)V"
    SPI Nor total size: 16MB
    NAND:  0 MiB
    MMC:
    {env_warning}In:    serial
    Out:   serial
    Err:   serial
    Net:   eth0

