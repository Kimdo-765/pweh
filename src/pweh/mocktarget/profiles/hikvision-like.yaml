# pweh.mocktarget 시뮬레이터 프로필 — "hikvision-like" 벤더 스타일 합성 카메라 (예제·e2e 테스트용)
#
# PWEH SYNTHETIC TEST FIRMWARE - NOT VENDOR CODE
# 하드웨어·부트로더·커널 출력은 hisilicon-like 프로필(HiSilicon V4 유사, U-Boot 2016.11 포크)을 그대로 복사했다
# (load_profile 에 extends 가 없어 전체를 복사함). 달라진 것은 rootfs 의 벤더 스타일 구성요소뿐이다.
# - 메인 앱 이름 davinci, 배너 형식 App-webs/, API 핸들러 계열(ISAPI/PSIA/SDK/HikCGI 형 경로)은
#   docs/references/cctv-vuln-patterns.md §3.1·§4.1 의 공개된 "펌웨어 쪽 지표"만 빌렸다. 설치 경로(/usr/bin/davinci)는 합성이다.
# - 코드(vendor_src/davinci_like.c)는 새로 쓴 합성 코드다. 실제 벤더 코드·키·자격증명·요청 형식은 없다.
# - 심은 취약점(정답)은 firmware.extra_planted_issues 에 있고 빌드 매니페스트 planted_issues 에 합쳐진다.
#   공통 합성 httpd 의 PWEH-PLANT-01..06 도 그대로 들어 있다.
# 한계: 리눅스 셸 흉내(linux.py)는 rootfs.build_tree 로 파일 화면을 만들므로 /usr/bin/davinci 나 rcS 추가 줄이
#       ls/cat 에 보이지 않는다. /dev/mtd* 읽기(dd/md5sum/hexdump)는 실제 플래시 바이트라 정확하다.
name: hikvision-like
description: >-
  Hikvision 스타일 합성 IP 카메라 (hisilicon-like 하드웨어 + davinci 형 메인 앱, ISAPI/PSIA/SDK/HikCGI 형
  핸들러 계열). 정적 분석 예제용 합성 데이터이며 실제 벤더 펌웨어가 아니다.
aliases: [mock-hikvision]
pipeline_profile: hikvision-ipc
arch: arm
endianness: little
baud: 115200

flash:
  type: spi-nor
  model: "W25Q128(B/F)V"
  jedec_id: [0xef, 0x40, 0x18]
  size: 16MiB
  page_size: 256
  erase_size: 64KiB
  mtdparts: "hi_sfc:256k(boot),64k(env),2048k(kernel),5120k(rootfs),-(app)"
  # FMC 메모리 매핑 읽기 창 (md 로 플래시를 직접 볼 수 있음, 쓰기 불가)
  memory_window: 0x14000000

dram:
  base: 0x40000000
  size: 64MiB

uart:
  rx_fifo: 32            # PL011 RX FIFO
  linux_rx_buffer: 4096  # N_TTY_BUF_SIZE

