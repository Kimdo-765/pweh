firmware:
  build_date: "2020-03-23 15:10:41"
  epoch: 1584947441
  web_server: /usr/sbin/httpd
  zig_target: arm-linux-musleabi
  squashfs_comp: xz
  app_mount: /app
  # --- 벤더 스타일 추가 구성 (pweh.mocktarget.firmware 가 rootfs 트리에 더한다) ---
  # extra_binaries: profiles/ 기준 상대 경로의 C 소스를 zig 로 빌드해 dest 에 넣는다 (빠른 빌드/zig 없음 → 생략).
  extra_binaries:
    - source: vendor_src/davinci_like.c
      dest: /usr/bin/davinci
  extra_dirs: [/usr/share/webroot/i18n/en]
  extra_files:
    - path: /usr/share/webroot/i18n/en/README.txt
      content: |
        PWEH SYNTHETIC TEST FIRMWARE - NOT VENDOR CODE
        language pack placeholder (en)
    - path: /etc/init.d/rcS
      append: |

        # hikvision-like (synthetic): main application
        echo "ipcam: starting synthetic main app"
        /usr/bin/davinci -p 8080 &
  # 정답(ground truth). file 이 빌드된 트리에 있을 때만 매니페스트 planted_issues 에 들어간다.
  # indicators: 정적 분석 도구 출력에서 이 문제를 가리키는 문자열 (테스트 정답 대조용).
  extra_planted_issues:
    - id: PWEH-HIK-01
      category: auth-bypass
      title: HikCGI 형 핸들러 계열에만 있는 매직 파라미터 인증 생략 (비밀번호 무시)
      severity: critical
      file: /usr/bin/davinci
      function: hikcgi_auth
      pattern: >-
        query_param(query, "pweh_synth_auth") 가 있으면 base64 디코드한 ':' 앞 사용자 이름을 신원으로 쓰고 return 1
        (verify_password 호출 없음). ISAPI/PSIA/SDK 계열의 auth 함수는 basic_auth_check 만 부른다 (핸들러 간 비대칭).
      pattern_class: P4
      modelled_on: CVE-2017-7921
      indicators: ["/Security/users", "pweh_synth_auth"]
    - id: PWEH-HIK-02
      category: command-injection
      title: 인증 전 언어 설정 핸들러의 language 값 → system() 명령 주입
      severity: critical
      file: /usr/bin/davinci
      function: handle_web_language
      pattern: >-
        xml_value(body, "language") → snprintf(cmd, "cp -rf /usr/share/webroot/i18n/%s/* /tmp/i18n/ 2>/dev/null", lang); system(cmd).
        dispatch() 가 "/SDK/webLanguage" 를 인증 루프보다 먼저 처리한다.
      pattern_class: P11
      modelled_on: CVE-2021-36260
      indicators: ["webLanguage"]
