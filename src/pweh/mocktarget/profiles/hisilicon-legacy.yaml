# pweh.mocktarget 시뮬레이터 프로필 — HiSilicon V1~V3 계열 "유사" 카메라 (합성 데이터)
#
# 실제 벤더 펌웨어/코드가 아니다. HiSilicon Hi3518EV200 SDK 의 U-Boot 2010.06 포크 동작을 재현한다:
# simple 파서, CONFIG_SYS_LONGHELP 없음(사용법 한 줄), print_buffer 마지막 줄 패딩 없음, 플래시 저장 순서
# printenv(+ 2010.06 크기 공식), "%u KiB hi_fmc at 0:0 is now current device", sf read 성공 시 빈 줄,
# env CRC 워드가 0xFFFFFFFF 면 부팅 중 기본 env 자동 기록, 대문자 "CRC32 for".
# 값과 배치는 docs/references/uboot-and-boot-console.md §14.1/§14.3 합성 트랜스크립트와 맞췄다.
# 근거: ~/pweh-refs/openipc/u-boot-hi3516cv200 (common/main.c, cmd_mem.c, cmd_sf.c, cmd_nvedit.c, env_sf.c,
#       cmd_bdinfo.c, lib/display_options.c, include/configs/hi3518ev200.h), 공개 Hi3518EV200 부팅 로그
name: hisilicon-legacy
description: >-
  HiSilicon Hi3518EV200 유사 ARM926EJ-S IP 카메라 (U-Boot 2010.06 SDK 포크, simple 파서, Linux 3.4.35,
  BusyBox 1.24.1, 16MiB SPI NOR). 오래된 HiSilicon 카메라 계열의 출력 형식. 합성 데이터.
aliases: [hi3518ev200-like, hisilicon-2010]
pipeline_profile: hisilicon-ipcam
arch: arm
endianness: little
baud: 115200

flash:
  type: spi-nor
  model: "MX25L128XX"
  device_name: hi_fmc
  jedec_id: [0xc2, 0x20, 0x18]
  size: 16MiB
  page_size: 256
  erase_size: 64KiB
  mtdparts: "hi_sfc:512k(boot),256k(env),3072k(kernel),8192k(rootfs),-(app)"
  memory_window: 0x58000000

dram:
  base: 0x80000000
  size: 64MiB

uart:
  rx_fifo: 16
  linux_rx_buffer: 4096

uboot:
  dialect: hisilicon-2010
  version: "U-Boot 2010.06 (Mar 05 2018 - 10:12:41)"
  prompt: "hisilicon # "
  maxargs: 32
  cbsize: 1024
  loadaddr: 0x82000000
  autoboot:
    delay: 1
    keys: null
    zero_check: true
  bdinfo:
    arch_number: 0x00001F40
    env_t: 0x00000000
    boot_params: 0x80000100
  env_offset: 0x80000
  env_size: 0x40000
  # 저장 순서가 printenv 순서다 (2010.06 은 정렬하지 않는다)
  env:
    bootargs: "mem=40M console=ttyAMA0,115200 root=/dev/mtdblock3 rootfstype=squashfs mtdparts=hi_sfc:512k(boot),256k(env),3072k(kernel),8192k(rootfs),-(app)"
    bootcmd: "sf probe 0;sf read 0x82000000 0xc0000 0x300000;bootm 0x82000000"
    bootdelay: "1"
    baudrate: "115200"
    ethaddr: "00:00:23:34:45:66"
    ipaddr: 192.168.1.10
    serverip: 192.168.1.2
    netmask: 255.255.255.0
    bootfile: '"uImage"'
    verify: "n"
  default_env:
    bootargs: "mem=96M console=ttyAMA0,115200"
    bootcmd: "bootm 0x82000000"
    bootdelay: "1"
    baudrate: "115200"
    ethaddr: "00:00:23:34:45:66"
    ipaddr: 192.168.1.10
    serverip: 192.168.1.2
    netmask: 255.255.255.0
    bootfile: '"uImage"'
  # console_init_r 이 stdin/stdout/stderr 를, main_loop 이 ver(CONFIG_VERSION_VARIABLE)를 실행 중에 setenv
  runtime_env:
    stdin: serial
    stdout: serial
    stderr: serial
    ver: "{version}"
  commands: ["?", base, bdinfo, boot, bootd, bootm, cmp, coninfo, cp, crc32, echo, getinfo, go, help, iminfo,
             loop, md, mm, mtest, mw, nm, ping, printenv, reset, run, saveenv, setenv, sf, sleep, tftp, version]
  net:
    eth_name: eth0
    link_down:
      - "Hisilicon ETH net controler"
      - "MAC:   00-00-23-34-45-66"
      - "UP_PORT : phy status change : LINK=DOWN : DUPLEX=FULL : SPEED=100M"
  timings:
    bootrom: 0.2
    banner_line: 0.004
    flash_read_bps: 6000000
    flash_erase_block: 0.05
    flash_program_bps: 250000
    kernel_line: 0.01
    userspace: 0.6
  banner: |


    System startup


    {version}

    Check Flash Memory Controller v100 ... Found
    SPI Nor(cs 0) ID: 0xc2 0x20 0x18
    Block:64KB Chip:16MB Name:"MX25L128XX"
    SPI Nor total size: 16MB
    {env_warning}In:    serial
    Out:   serial
    Err:   serial

