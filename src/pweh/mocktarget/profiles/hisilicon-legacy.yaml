linux:
  hostname: "(none)"
  busybox_banner: "BusyBox v1.24.1 (2018-03-05 10:05:33 CST)"
  login:
    username: root
    password: "666666"
    motd: ""
  shell_prompt: "# "
  askfirst: true
  rcs_output: |
    Starting telnetd...
    ipcam: starting synthetic httpd on port 80
  applets: ["[", "[[", ash, base64, basename, cat, chmod, chown, cp, cut, date, dd, df, dmesg, du, echo, egrep,
            env, expr, "false", fgrep, find, flash_eraseall, flashcp, free, getty, grep, gunzip, gzip, halt, hd, head,
            hexdump, hostname, id, ifconfig, init, insmod, kill, killall, linuxrc, ln, login, ls, lsmod, md5sum,
            mdev, mkdir, mknod, mount, mv, netstat, passwd, ping, poweroff, ps, pwd, reboot, rm, rmdir, rmmod,
            route, sed, sh, sleep, sync, tail, tar, tee, telnetd, test, tftp, top, touch, "true", udhcpc, umount,
            uname, uptime, usleep, vi, wc, wget, which, zcat]
  processes:
    - [1, root, 1584, "S", "init"]
    - [2, root, 0, "SW", "[kthreadd]"]
    - [3, root, 0, "SW", "[ksoftirqd/0]"]
    - [5, root, 0, "SW<", "[khelper]"]
    - [92, root, 0, "SW<", "[kblockd]"]
    - [210, root, 0, "SW", "[kswapd0]"]
    - [520, root, 1584, "S", "/usr/sbin/telnetd"]
    - [524, root, 2296, "S", "/usr/sbin/httpd -p 80 -h /var/www"]
  mounts:
    - ["rootfs", "/", "rootfs", "rw"]
    - ["/dev/root", "/", "squashfs", "ro,relatime"]
    - ["proc", "/proc", "proc", "rw,relatime"]
    - ["sysfs", "/sys", "sysfs", "rw,relatime"]
    - ["tmpfs", "/tmp", "tmpfs", "rw,relatime"]
    - ["/dev/mtdblock4", "/app", "squashfs", "ro,relatime"]
  interfaces:
    eth0:
      hwaddr: "00:00:23:34:45:66"
      inet: 192.168.1.10
      bcast: 192.168.1.255
      mask: 255.255.255.0
      flags: "UP BROADCAST MULTICAST"
      mtu: 1500
      txqueuelen: 1000
  listening:
    - [tcp, "0.0.0.0:80"]
    - [tcp, "0.0.0.0:23"]
    - [tcp, "0.0.0.0:554"]

firmware:
  build_date: "2018-03-05 10:05:33"
  epoch: 1520215533
  web_server: /usr/sbin/httpd
  zig_target: arm-linux-musleabi
  squashfs_comp: xz
  app_mount: /app
