# pweh.mocktarget 시뮬레이터 프로필 — Ingenic T31 계열 "유사" 카메라 (합성 데이터)
#
# 실제 벤더 펌웨어/코드가 아니다. 출력 "형식"은 Ingenic SDK 의 베이스인 U-Boot 2013.07 포크
# (common/main.c simple 파서, common/cmd_sf.c 의 PRINT_TIME, common/hash.c, common/cmd_bdinfo.c MIPS),
# Linux 3.10 (drivers/mtd, init/do_mounts.c, arch/mips/kernel/proc.c), BusyBox 소스에서 확인한 코드
# 경로를 따르고, 값(날짜·주소·문구)은 합성한 것이다.
# 근거: ~/pweh-refs/openipc/u-boot-ingenic, ~/pweh-refs/openipc/u-boot-t40/include/configs/isvp_t31.h,
#       docs/references/uboot-and-boot-console.md
name: ingenic-like
description: >-
  Ingenic T31 유사 MIPS(XBurst) IP 카메라 (U-Boot 2013.07 SDK 포크, simple 파서, Linux 3.10.14,
  BusyBox 1.22.1, base64 애플릿 없음, 16MiB SPI NOR). 합성 데이터.
aliases: [mock-ingenic, ingenic, t31-like]
pipeline_profile: mock-ingenic
arch: mips
endianness: little
baud: 115200

flash:
  type: spi-nor
  model: "BY25Q128AS"
  jedec_id: [0x68, 0x40, 0x18]
  size: 16MiB
  page_size: 256
  erase_size: 64KiB
  mtdparts: "jz_sfc:256k(boot),64k(env),2048k(kernel),4096k(rootfs),9920k(appfs)"

dram:
  base: 0x80000000
  size: 64MiB

uart:
  rx_fifo: 64            # JZ UART RX FIFO
  linux_rx_buffer: 4096

uboot:
  dialect: ingenic-2013
  version: "U-Boot 2013.07 (Dec 09 2020 - 11:32:38)"
  spl_version: "U-Boot SPL 2013.07 (Dec 09 2020 - 11:32:38)"
  prompt: "isvp_t31# "
  maxargs: 64
  cbsize: 1024
  loadaddr: 0x80600000
  cc_version: "mips-linux-gnu-gcc (Ingenic r2.3.3 2016.12) 4.7.2"
  ld_version: "GNU ld (Ingenic r2.3.3 2016.12) 2.24.51.20140512"
  autoboot:
    delay: 1
    keys: null
    zero_check: true
  bdinfo:
    boot_params: 0x81f6bf60
    memstart: 0x80000000
    memsize: 0x04000000
    flashstart: 0x00000000
    flashsize: 0x00000000
    flashoffset: 0x00000000
  env:
    baudrate: "115200"
    bootargs: "console=ttyS1,115200n8 mem=42M@0x0 rmem=22M@0x2a00000 init=/linuxrc rootfstype=squashfs root=/dev/mtdblock3 rw mtdparts=jz_sfc:256k(boot),64k(env),2048k(kernel),4096k(rootfs),9920k(appfs)"
    bootcmd: "sf probe;sf read 0x80600000 0x50000 0x200000; bootm 0x80600000"
    bootdelay: "1"
    ethaddr: "00:d0:d0:00:95:27"
    gatewayip: 193.169.4.1
    ipaddr: 193.169.4.81
    loads_echo: "1"
    netmask: 255.255.255.0
    serverip: 193.169.4.2
  default_env:
    baudrate: "115200"
    bootargs: "console=ttyS1,115200n8 mem=42M@0x0 rmem=22M@0x2a00000 init=/linuxrc rootfstype=squashfs root=/dev/mtdblock2 rw mtdparts=jz_sfc:256k(boot),2560k(kernel),2048k(root),-(appfs)"
    bootcmd: "sf probe;sf read 0x80600000 0x40000 0x280000; bootm 0x80600000"
    bootdelay: "1"
    ethaddr: "00:d0:d0:00:95:27"
    gatewayip: 193.169.4.1
    ipaddr: 193.169.4.81
    loads_echo: "1"
    netmask: 255.255.255.0
    serverip: 193.169.4.2
  runtime_env:
    stdin: serial
    stdout: serial
    stderr: serial
  commands: ["?", base, bdinfo, boot, bootd, bootm, cmp, coninfo, cp, crc32, echo, env, "false", go, help,
             iminfo, loop, md, mm, mtdparts, mtest, mw, nm, ping, printenv, reset, run, saveenv, setenv, sf,
             sleep, test, tftp, tftpboot, tftpput, "true", version]
  net:
    eth_name: Jz4775-9161
    link_down:
      - "Jz4775-9161 Waiting for PHY auto negotiation to complete.... TIMEOUT !"
  timings:
    bootrom: 0.15
    banner_line: 0.004
    spl_line: 0.002
    flash_read_bps: 7200000
    flash_erase_block: 0.04
    flash_program_bps: 300000
    kernel_line: 0.01
    userspace: 0.5
  spl_banner: |


    {spl_version}
    Timer init
    CLK stop
    PLL init
    pll_init:366
    nf=116 nr = 1 od0 = 1 od1 = 2
    cppcr is 07405100
    CPM_CPAPCR 0750510d
    nf=99 nr = 1 od0 = 1 od1 = 2
    cppcr is 06305100
    CPM_CPMPCR 0630510d
    cppcr 0x9a7b5510
    apll_freq 1392000000
    mpll_freq 1188000000
    ddr sel mpll, cpu sel apll
    ddrfreq 594000000
    cclk  1392000000
    l2clk 696000000
    h0clk 237600000
    h2clk 237600000
    pclk  118800000
    CLK init
    SDRAM init
    sdram init start
    DDR clk rate 594000000
    sdram init finished
    SDRAM init ok
    board_init_r
    image entry point: 0x80100000
  banner: |


    {version}

    Board: ISVP (Ingenic XBurst T31 SoC)
    DRAM:  64 MiB
    Top of RAM usable for U-Boot at: 84000000
    Reserving 446k for U-Boot at: 83f90000
    Reserving 32784k for malloc() at: 81f8c000
    Reserving 32 Bytes for Board Info at: 81f8bfe0
    Reserving 124 Bytes for Global Data at: 81f8bf60
    Reserving 128k for boot params() at: 81f6bf60
    Stack Pointer at: 81f6bf48
    Now running in RAM - U-Boot at: 83f90000
    MMC:   msc: 0
    the manufacturer 68
    SF: Detected BY25Q128AS
    {env_warning}
    In:    serial
    Out:   serial
    Err:   serial
    Net:   ====>PHY not found!Jz4775-9161

