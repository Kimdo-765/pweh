  applets: ["[", "[[", addgroup, adduser, ash, basename, cat, chgrp, chmod, chown, chroot, clear, cmp, cp,
            cut, date, dd, delgroup, deluser, devmem, df, dirname, dmesg, du, echo, egrep, env, expr, "false",
