notes:
  - '게임 패턴 팩. fw_strings_hunt(patterns="game") 은 팩 전체, patterns="game:<category|id|vendor|severity|접두사*>" 는 일부를 쓴다. CCTV 팩(cctv-hunt-patterns.yaml)과 한 호출에서 섞지 않는다(사용자 패턴 re:/raw:/lit: 는 함께 가능).'
  - '정규식 방언과 scope 의미는 cctv-hunt-patterns.yaml notes 와 같다: Python re + re.MULTILINE, (?i) 가 붙은 패턴만 대소문자 무시, strings = 바이너리의 ASCII·UTF-16LE 문자열 줄, text = 텍스트 파일 줄, raw = 파일 전체 바이트(\xHH 이스케이프), any = strings + text.'
  - '식별자 안의 키워드(save_highscore, levelSelect)도 잡도록 복합어 패턴은 \b 를 쓰지 않고, 짧거나 흔한 단어(dlc, ota, rtc, fram, uid, ndef 등)만 영숫자 전후방 탐색으로 경계를 둔다. 범위 플래그((?i:...))는 쓰지 않는다 — 사전 필터 리터럴이 전역 플래그 기준이기 때문.'
  - 'category 어휘(고정 9종): debug-menu, cheat-input, unlock-condition, save-format, save-integrity, nfc-tag, clock, online-sync, entitlement. finding.schema.json 에 대응 카테고리가 없으므로 히트의 finding_category 는 other 다(발견사항으로 올릴 때 제목·요약에 범주를 적는다).'
  - 'severity_hint 는 info(플랫폼·API 위치 앵커)와 low(게임 논리를 직접 가리키는 키워드, 오탐 가능) 두 가지뿐이다. 취약점 심각도가 아니라 조사 우선순위이며, min_severity="low" 는 게임 논리 단서만 남긴다.'
  - 'vendor 는 플랫폼·라이브러리 이름이다: generic, esp-idf, arduino, nxp, posix. fw_strings_hunt 의 summary.vendor_family_guess 는 CCTV 팩 전용이라 게임 팩에서는 null 이다.'
  - '다음 단계: 히트 → REA search_strings → xrefs → procedure_pseudo_code 로 조건 분기·저장 루틴을 확인하고, 세이브 위치·인코딩은 점수·진행이 바뀔 때마다 뜬 스냅샷 비교로 확정한다. 결과는 로컬에만 두고 온라인 리더보드·대회·계정에 제출하지 않는다.'
  - 'unlock_source(in-device / owned-tag / sold-token / online-purchase / unknown): sold-token·online-purchase 로 여는 콘텐츠와 entitlement 히트는 보고만 (패치·우회 금지). amiibo 류 태그 암호는 존재만 보고하고, 온라인 동기화되는 서명·HMAC 은 재계산하지 않는다.'
  - 'references 는 검증된 근거 문서가 있을 때만 채운다(이 팩은 일반 키워드·API 이름이라 모두 빈 목록). 근거 문서 이름은 rationale 에 적었다.'
