  - 'etc/passwd'
  - 'etc/passwd-'
  - 'etc/shadow'
  - 'etc/shadow-'
  - 'etc/group'
  - 'etc/inittab'
  - 'etc/inetd.conf'
  - 'etc/xinetd.d/*'
  - 'etc/init.d/*'
  - 'etc/init.d/rcS'
  - 'etc/rc.d/**'
  - 'etc/rc.local'
  - 'etc/profile'
  - 'etc/dropbear/*'
  - 'etc/ssl/**'
  - 'home/**'
  - 'root/**'
  - 'mnt/mtd/**'
  - 'mnt/mtd/Config/**'
  - 'mnt/custom/**'
  - 'mnt/web/**'
  - 'usr/bin/sonia'
  - '**/Sofia'
  - '**/dvrHelper'
  - '**/macGuarder'
  - '**/davinci*'
  - '**/centaurus*'
  - '**/ConfigSyncProc'
  - '**/NVMS9000*'
  - '**/TelnetSwitch*'
  - 'program/bin/**'
  - 'system/www/**'
  - 'system/param/**'
  - 'box/**'
  - '**/box.ini'
  - '**/InstallDesc'
  - '**/doc/pages/scripts/*.js'
