  - '**/html/**'

credential_patterns:
  - id: passwd-empty-password
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^(?P<user>[^:#\s][^:\n]*)::'
    category: hardcoded-credential
    severity_hint: high
    rationale: '비밀번호 필드가 비어 있는 계정. telnet/UART/login 경로에서 무비밀번호 로그인 가능성.'
    references: []
  - id: passwd-hash-in-passwd
    files: ['etc/passwd', 'etc/passwd-']
    pattern: '^(?P<user>[^:#\s][^:\n]*):(?!x:|\*|!)(?P<hash>[^:\n]{2,}):'
    category: hardcoded-credential
    severity_hint: medium
    rationale: 'shadow 없이 /etc/passwd에 해시가 직접 들어간 형태. 카메라 펌웨어의 고정 root 해시가 흔히 이 형태(tothi, Kojenov, Pierre Kim 사례).'
    references: [CVE-2017-8224, CVE-2020-24218]
  - id: passwd-des-crypt
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^(?P<user>[^:#\s][^:\n]*):(?P<hash>[./0-9A-Za-z]{13}):'
    category: hardcoded-credential
    severity_hint: high
    rationale: '전통 DES crypt(13자, 비밀번호 8자 절단). 공개 사례: XiongMai absxcfbgXtb3o, 인코더 9yVwSCpfKcYJg와 qiYX370VaJ3u., TVT 해시 2종.'
    references: [CVE-2020-24218]
  - id: passwd-md5-crypt
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^(?P<user>[^:#\s][^:\n]*):(?P<hash>\$1\$[./0-9A-Za-z]{0,8}\$[./0-9A-Za-z]{22}):'
    category: hardcoded-credential
    severity_hint: medium
    rationale: 'MD5-crypt 해시. 펌웨어 고정 계정이면 모든 장비 공통 비밀번호일 수 있음.'
    references: [CVE-2017-8224, CVE-2020-24218]
  - id: passwd-extra-uid0
    files: ['etc/passwd', 'etc/passwd-']
    pattern: '^(?!root:)(?P<user>[^:#\s][^:\n]*):[^:\n]*:0:'
    category: backdoor
    severity_hint: high
    rationale: 'root 외의 UID 0 계정.'
    references: []
  - id: known-hash-xm-root-xc3511
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^root:absxcfbgXtb3o:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'XiongMai/HiSilicon DVR 고정 root DES 해시(tothi, 공개 평문 xc3511). Yarmak은 CVE-2021-41506 관련 백도어 활성화 후 유효 root 비밀번호 후보로 xc3511을 제시.'
    references: [CVE-2021-41506]
  - id: known-hash-tvt-root-a
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^root:tsfhKsZ1p7nE2:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'TVT/OEM 하드코딩 root 해시(bashis 2018, CVE 미확인, 공개 평문 china123 — crypt(3)로 재확인): https://github.com/mcw0/PoC/blob/master/TVT_and_OEM_IPC_NVR_DVR_RCE_Backdoor_and_Information_Disclosure.txt'
    references: []
  - id: known-hash-tvt-root-b
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^root:3kzd9/xqjB\.3k:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'TVT/OEM 하드코딩 root 해시(bashis 2018, CVE 미확인, 공개 평문 1001chin — crypt(3)로 재확인). 출처는 known-hash-tvt-root-a와 동일.'
    references: []
  - id: known-hash-hienc-root-unisheen
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-', '**/passwd']
    pattern: '^root:9yVwSCpfKcYJg:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'URayTech 인코더 root 해시(Kojenov, 공개 평문 unisheen).'
    references: [CVE-2020-24218]
  - id: known-hash-hienc-root-neworang
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-', '**/passwd']
    pattern: '^root:qiYX370VaJ3u\.:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'Kojenov 글의 경로 순회 예시 출력(인코더 /etc/passwd)에 나온 root DES 해시. crypt(3)로 재계산하면 neworang(= 백도어 비밀번호 neworange88888888의 앞 8자)과 일치한다(검증 2026-10-18). 웹 백도어 비밀번호가 root 비밀번호로도 설정된 사례.'
    references: [CVE-2020-24218]
  - id: known-hash-hienc-root-neworangetech
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-', '**/passwd']
    pattern: '^root:\$1\$/5bWggz/\$JkbAnqFTv7HwEWr3DFJiC0:'
    category: hardcoded-credential
    severity_hint: critical
    rationale: 'J-Tech 인코더 펌웨어 root 해시(Kojenov, 공개 평문 neworangetech). VU#896979는 J-Tech를 CVE-2020-24218 Not Affected로 표기.'
    references: [CVE-2020-24218]
  - id: known-hash-wificam-root
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-']
    pattern: '^root:\$1\$ybdHbPDn\$ii9aEIFNiolBbM9QxW9mr0:'
    category: backdoor
    severity_hint: critical
    rationale: 'WIFICAM(GoAhead 개조 OEM) 백도어 root 계정(Pierre Kim).'
    references: [CVE-2017-8224]
  - id: sofia-empty-password-hash
    files: ['mnt/mtd/Config/**', '**/Account*']
    pattern: '\btlJwpbo6\b'
    category: hardcoded-credential
    severity_hint: high
    rationale: 'Sofia 해시(MD5 파생 8자)로 계산한 빈 비밀번호 값(tothi). NVD CVE-2022-45045 설명의 default admin:tlJwpbo6.'
    references: [CVE-2022-45045]
  - id: config-weak-password-value
    files: ['**/*.ini', '**/*.conf', '**/*.cfg', '**/*.xml', '**/*.json', 'mnt/mtd/Config/**']
    pattern: '(?i)\b(?:pass(?:word)?|pwd|passwd)[ \t]*[=:][ \t]*"?(?:admin|123456|12345|1234|888888|666666|password|default)?"?[ \t]*(?:[,;}<]|$)'
    category: hardcoded-credential
    severity_hint: medium
    rationale: '설정 파일의 빈/약한 기본 비밀번호 값(일반 휴리스틱). XMeye admin 공란(SEC Consult SA-20181009-0, 별도 CVE 없음: https://seclists.org/bugtraq/2018/Oct/27) 같은 기본값 확인용. 숨은 default 계정(tluafed, CVE-2018-17919)은 xm-default-user-tluafed가 담당한다.'
    references: []
  - id: known-default-password-candidates
    files: ['etc/passwd', 'etc/passwd-', 'etc/shadow', 'etc/shadow-', '**/passwd']
    pattern: '^(?P<user>[^:#\s][^:\n]*):(?P<hash>\$1\$[./0-9A-Za-z]{0,8}\$[./0-9A-Za-z]{22}|[./0-9A-Za-z]{13}):'
    category: hardcoded-credential
    severity_hint: high
    rationale: '추출한 crypt 해시를 아래 candidate_passwords로 오프라인 대조(crypt(3)). 출처: Mirai scanner.c(인코딩된 바이트를 XOR 0x22로 디코드한 값 기준. 주석 두 곳이 실제 값과 다르다: Administrator 항목의 실제 비밀번호는 meinsm, admin 항목 하나의 실제 값은 4321), Yarmak(XiongMai root 후보), Kojenov(인코더), bashis 2018(TVT root: china123, 1001chin). 벤더 매핑은 하지 않는다. DES crypt는 앞 8자만 유효.'
    references: [CVE-2021-41506, CVE-2020-24218]
    candidate_passwords:
