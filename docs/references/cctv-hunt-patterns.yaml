    pattern: '/cgi-bin/param\.cgi\b'
    category: auth-bypass
    severity_hint: medium
    scope: any
    vendor: ptzoptics
    rationale: 'Authorization 헤더가 없으면 인증을 적용하지 않음(KEV).'
    references: [CVE-2024-8956]
  - id: ptz-ntp-addr
    pattern: '\bntp_addr\b'
    category: command-injection
    severity_hint: medium
    scope: any
    vendor: ptzoptics
    rationale: 'ntp_addr 값이 ntp_client 기동 시 명령으로 실행(KEV).'
    references: [CVE-2024-8957]
  - id: foscam-uri-substring-delete
    pattern: '/(?:snapPic|configs/export)/'
    category: auth-bypass
    severity_hint: medium
    scope: any
    vendor: foscam
    rationale: 'URI 부분 문자열 검색 뒤 strncat + access + remove로 무인증 경로 순회 파일 삭제(VDOO).'
    references: [CVE-2018-6830]
  - id: foscam-ntp-server
    pattern: '\b(?:ntpServer|setSystemTime)\b'
    category: command-injection
    severity_hint: medium
    scope: any
    vendor: foscam
    rationale: 'setSystemTime ntpServer 명령 주입(CVE-2017-2849의 불완전 수정).'
    references: [CVE-2018-6831, CVE-2017-2849]
  - id: herospeed-telnetswitch
    pattern: '\bTelnetSwitch\b'
    category: debug-interface
    severity_hint: high
    scope: any
    vendor: herospeed
    rationale: 'TCP/787 telnetd 활성화 데몬(bashis 2018, CVE 미확인): https://github.com/mcw0/PoC/blob/master/Herospeed-TelnetSwitch.py'
    references: []

  # ---------------- 일반(벤더 무관) ----------------
  - id: gen-telnetd-launch
    pattern: '(?:^|[\s;&|(/])telnetd(?=$|[\s;&|)])'
    category: debug-interface
    severity_hint: medium
    scope: text
    vendor: generic
    rationale: '부팅 스크립트나 inittab의 telnetd 무조건 기동. 기본 실행, 비활성화 불가 사례 있음.'
    references: [CVE-2017-8224, CVE-2020-24218]
  # gen-telnetd-login-shell·gen-getty-autologin·gen-static-digest-nonce 의 같은 줄 간격 {0,1024}? 는 원래 정규식을 쓰는 fw_strings_hunt 의
  # 선형 시간을 위한 상한이다(무제한이면 키워드 홍수에 이차 시간). 기본 감사의 시작 스크립트 검사는 상한 256 이상의 간격을 길이 제한 없이 본다.
  # 그 밖의 반복('-l' 뒤 공백 [ \t]*, nonce 값 [^"%]+)은 바로 뒤 구분자('/', '"')와 겹치지 않아 선형이므로 HEAD 그대로 둔다.
  - id: gen-telnetd-login-shell
    pattern: 'telnetd\b[^\n]{0,1024}?[ \t]-l[ \t]*/bin/(?:sh|ash|bash)\b'
    category: backdoor
    severity_hint: high
    scope: any
    vendor: generic
    rationale: 'BusyBox telnetd -l LOGIN(Exec LOGIN on connect)에 셸을 지정하면 인증 없이 셸 제공.'
    references: []
  - id: gen-inittab-console-shell
    pattern: '^[^#:\n]*:[^:\n]*:(?:respawn|askfirst):-?/bin/(?:sh|ash|bash)(?:[ \t]+-[-A-Za-z]+)*[ \t\r]*$'
    category: debug-interface
    severity_hint: high
    scope: text
    vendor: generic
    rationale: 'BusyBox inittab(<id>:<runlevels>:<action>:<process>)에서 getty/login 없이 대화형 셸 실행(예제 파일의 ::askfirst:-/bin/sh). UART 무비밀번호 root 셸. action은 respawn/askfirst만, process는 셸 경로와 옵션(-l, --login 등)만 허용해 ::sysinit:/bin/sh /etc/init.d/rcS 같은 정상 스크립트 실행 줄은 제외한다.'
    references: []
  - id: gen-getty-autologin
    pattern: 'getty\b[^\n]{0,1024}?[ \t]-l[ \t]*/bin/(?:sh|ash|bash)\b'
    category: debug-interface
    severity_hint: high
    scope: text
    vendor: generic
    rationale: 'getty -l LOGIN(Invoke LOGIN instead of /bin/login)에 셸 지정. -n과 함께면 프롬프트도 없음.'
    references: []
  - id: gen-inetd-telnet
    pattern: '^[ \t]*(?:telnet|23)[ \t]+stream[ \t]+tcp6?[ \t]+(?:no)?wait\S*[ \t]+root\b'
    category: debug-interface
    severity_hint: medium
    scope: text
    vendor: generic
    rationale: 'inetd.conf의 telnet 서비스(BusyBox telnetd usage 예: 23 stream tcp wait root telnetd telnetd -w10).'
    references: []
  - id: gen-shell-cmd-template
    pattern: '\b(?:ntpdate|ntpd|ntpclient|ping|tcpdump|ftpput|ftpget|wget|tftp|msmtp|sendmail|nslookup|ifconfig|route|iptables|png2bmp|date\s+-s)\b[^\n]{0,80}%s'
    category: command-injection
    severity_hint: medium
    scope: strings
    vendor: generic
    rationale: '설정값을 %s로 끼워 넣는 셸 명령 템플릿(NTP, FTP, ping, tcpdump, 이미지 변환). system/popen 싱크와 연결되는지 추적.'
    references: [CVE-2018-6831, CVE-2017-2849, CVE-2024-8957, CVE-2020-24217]
  - id: gen-sh-c-template
    pattern: '\b(?:/bin/)?sh\s+-c\s+[^\n]{0,60}%s'
    category: command-injection
    severity_hint: medium
    scope: strings
    vendor: generic
    rationale: 'sh -c 명령 템플릿에 포맷 인자 삽입.'
    references: []
  - id: gen-hardcoded-basic-auth
    pattern: 'Authorization:\s*Basic\s+[A-Za-z0-9+/]{8,}={0,2}'
    category: hardcoded-credential
    severity_hint: high
    scope: any
    vendor: generic
    rationale: '포맷 지정자 없이 base64 자격증명이 박힌 Authorization 헤더(내장 자격증명).'
    references: []
  - id: gen-private-key-pem
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----(?:\r?\n|(?:\\r)?\\n)(?:[A-Za-z][A-Za-z-]*: [^\r\n\\]*(?:\r?\n|(?:\\r)?\\n))*(?:\r?\n|(?:\\r)?\\n)?[A-Za-z0-9+/]{32}'
    category: crypto
    severity_hint: high
    scope: raw
    vendor: generic
    rationale: '펌웨어 내장 개인키(모든 장비 공통일 가능성). 머리줄 뒤에 base64 본문(32자 이상, 선택적인 Proc-Type·DEK-Info 머리글 줄 뒤)이 있어야 맞는다 — 줄바꿈은 실제 CR/LF 또는 문자열 안의 \n 이스케이프. mbedTLS 같은 라이브러리의 PEM 머리줄 상수(본문 없이 NUL·END 상수가 옴)는 개인키가 아니다.'
    references: [CVE-2017-8222]
  - id: gen-mtd-config-accounts
    pattern: '/mnt/mtd/Config/(?:Account[0-9]*|passwd|Config1)\b'
    category: info-leak
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: 'Dahua/XiongMai 계열 사용자 DB와 설정 경로. 웹 서빙 경로나 무인증 핸들러와 연결되는지 확인.'
    references: [CVE-2017-7925, CVE-2017-8226]
  - id: gen-onvif-wsse-anchors
    pattern: '\b(?:PasswordDigest|wsse:Nonce|wsu:Created|UsernameToken)\b'
    category: auth-bypass
    severity_hint: info
    scope: any
    vendor: generic
    rationale: 'ONVIF WS-UsernameToken 처리 앵커(접두사 붙은 이름 wsse:Nonce, wsu:Created 기준. 실제 Dahua 펌웨어에 이 문자열이 그대로 있는지는 미확인이며, 접두사 없는 Nonce/Created만 있을 수도 있다). nonce 캐시와 Created 신선도(5분 가이드) 검사 유무 확인.'
    references: [CVE-2022-30563]
  - id: gen-static-digest-nonce
    pattern: 'Digest\s[^\n%]{0,1024}?nonce="[^"%]+"'
    category: crypto
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: '포맷 지정자 없는 고정 Digest nonce(Kojenov 관찰: nonce="tick"). 재전송 가능한 Digest 인증.'
    references: []
  - id: gen-backdoor-keywords
    pattern: '(?i)\b(?:backdoor|super_?pass(?:word)?|master_?pass(?:word)?|debug_?pass(?:word)?|factory_?pass(?:word)?|default_?pass(?:word)?)\b'
    category: hardcoded-credential
    severity_hint: low
    scope: any
    vendor: generic
    rationale: '일반 키워드 휴리스틱(오탐 많음). 히트 주변 비교 상수를 확인.'
    references: []
  - id: gen-debug-telnet-keywords
    pattern: '(?i)\b(?:open_?telnet|telnet_?(?:enable|open|on|switch)|enable_?telnet|start_?telnetd?|debug_?shell)\b'
    category: debug-interface
    severity_hint: low
    scope: any
    vendor: generic
    rationale: 'telnet 활성화나 디버그 셸 기능명 휴리스틱(OpenTelnet, TelnetSwitch 계열 포괄).'
    references: []
  - id: gen-loopback-trust-anchors
    pattern: '(?i)\b(?:is_?local_?(?:client|request|ip)|local_?client|from_?local(?:host)?|trust_?local)\b'
    category: auth-bypass
    severity_hint: low
    scope: any
    vendor: generic
    rationale: '로컬 요청 신뢰 판정 함수명 휴리스틱. 판정 근거가 소켓 peer 주소인지 요청 본문 값인지 확인.'
    references: [CVE-2021-33045]
  - id: comp-goahead-version
    pattern: '(?i)\bgoahead[-_ /]?(?:webs|webserver|http)?[-_ /]?v?(\d+\.\d+(?:\.\d+)?)\b'
    category: command-injection
    severity_hint: medium
    scope: strings
    vendor: generic
    rationale: 'GoAhead 버전 캡처. 3.6.5 미만이면서 CGI 활성, 동적 링크 CGI면 환경 변수 주입 RCE(KEV 2021-12-10). 현행 Embedthis 소스(src/http.c)는 Server 헤더로 버전 없는 GoAhead-http를 보내고 CGI 환경 변수 SERVER_SOFTWARE를 GoAhead/<ME_VERSION>으로 설정한다. nmap probe에는 GoAhead-Webs/<ver> 형식도 있다. 3.x 바이너리의 버전 문자열 형식은 (미확인).'
    references: [CVE-2017-17562]
  - id: comp-mini-httpd-version
    pattern: '\bmini_httpd/(\d+\.\d+)'
    category: info-leak
    severity_hint: medium
    scope: strings
    vendor: generic
    rationale: 'mini_httpd 버전 캡처(nmap 배너 형식 mini_httpd/<ver>). 1.30 미만이면 임의 파일 읽기.'
    references: [CVE-2018-18778]

  # ---------------- SD 카드 (펌웨어 쪽 공격 표면, docs/design/sd-forensics.md 5.1 의 사례 이름) ----------------
  # 짧은 이름(iu.sh, autoexec.sh, upgrade.sh)은 SD 마운트 경로와 함께일 때만 잡는다. 카드 쪽 침해 흔적 대조는 fw_sd_surface 의 sd_paths_referenced.
  # 모든 반복에 상한을 둔다(경로 조각 64자·8단, 문맥 160자) — 긴 문자열에서도 선형 시간. /mnt/tftpboot·/mnt/sdk 는 카드 경로가 아니고,
  # /mnt/sda1·/media/sdb 같은 SCSI 디스크 이름(sd+글자 하나(+숫자)·sd+글자 둘+숫자가 경로 조각 전체 — sdcard·sdhc 는 카드)도 카드가 아니다 (fw_sd_surface 와 같은 규칙).
  - id: sd-autorun-known-names
    pattern: '\b(?:snx_autorun\.sh|enable_telnetd\.dat)\b'
    category: backdoor
    severity_hint: high
    scope: any
    vendor: generic
    rationale: '알려진 SD 카드 자동 실행·트리거 파일 이름(Sonix snx_autorun.sh, Victure PC420 enable_telnetd.dat→autoexec.sh). 카드의 파일로 셸·telnet 이 켜진다. fw_sd_surface SD-01 과 REA xref 로 확인.'
    references: [CVE-2023-41612]
  - id: sd-card-script-path
    pattern: '(?:/mnt/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3}|disc\w{0,16})|/media/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3})|/tmp/sd|/system/sdcard|/sdcard)(?:/[\w.-]{1,64}){0,8}/[\w.-]{1,64}\.sh\b'
    category: backdoor
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: 'SD 카드 마운트 경로의 셸 스크립트 참조(Tenda CP3 iu.sh, Victure autoexec.sh 형태). 부팅·핫플러그 때 실행하는지 fw_sd_surface SD-01 과 REA 로 확인.'
    references: [CVE-2023-30356, CVE-2023-41612]
  - id: sd-uboot-auto-update
    pattern: '\b(?:do_auto_update|au_check_cksum_valid|au_check_header_valid|sdupdate|sdupgrade|hiupdate)\b'
    category: crypto
    severity_hint: high
    scope: any
    vendor: generic
    rationale: 'U-Boot 의 SD 자동 업데이트(Ingenic sdupdate, HiSilicon hiupdate, au_check_cksum_valid 는 CRC 만 검사). 서명 없이 카드 이미지로 플래시를 덮어쓸 수 있다(finding 은 insecure-update).'
    references: []
  - id: sd-update-image-names
    pattern: '\b(?:demo\.bin|ezviz\.dav)\b'
    category: crypto
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: '카드에서 찾는 업데이트 이미지 이름(Dafang/Wyze demo.bin, EZVIZ ezviz.dav). 검사가 CRC·버전뿐인지 REA 로 확인(finding 은 insecure-update).'
    references: [CVE-2018-12258]
  - id: sd-card-update-file
    pattern: '(?:/mnt/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3}|disc\w{0,16})|/media/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3})|/tmp/sd|/system/sdcard|/sdcard)(?:/[\w.-]{1,64}){0,8}/(?:upgrade|update|firmware|fwupdate)[\w.-]{0,64}\.(?:sh|bin|img|pkg|tar|tgz|zip|dav)\b'
    category: crypto
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: 'SD 카드 경로의 업데이트 파일·스크립트(upgrade.sh 형태). 카드 내용으로 펌웨어를 바꾸는 경로가 서명을 확인하는지 fw_sd_surface SD-02 와 REA 로 확인.'
    references: [CVE-2018-10988]
  - id: sd-uboot-card-boot-script
    pattern: '\b(?:fat|ext[24])?load\s{1,8}mmc\b[^\n]{0,120}?\b(?:boot\.scr|uEnv\.txt)\b'
    category: crypto
    severity_hint: low
    scope: any
    vendor: generic
    rationale: 'U-Boot 가 mmc 파일 시스템의 boot.scr·uEnv.txt 를 읽는다(메인라인 distro boot 형태). mmc 번호가 SD 슬롯인지 eMMC 인지는 보드에서 확인. fw_uboot_env 의 sd_boot 참고.'
    references: []
  - id: sd-log-to-card
    pattern: '\bsyslogd\b[^\n;|&]{0,160}?\s-O\s{0,8}(?:/mnt/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3}|disc\w{0,16})|/media/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3})|/tmp/sd|/system/sdcard|/sdcard)|\bcore_pattern\b[^\n]{0,80}?(?:/mnt/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3}|disc\w{0,16})|/media/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3})|/tmp/sd|/system/sdcard|/sdcard)|(?:/mnt/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3}|disc\w{0,16})|/media/(?:sd(?!k)(?!(?:[a-z]\d{0,8}|[a-z]{2}\d{1,8})(?!\w))\w{0,16}|mmc\w{0,16}|tf(?:_?card)?\d{0,3})|/tmp/sd|/system/sdcard|/sdcard)/[^\n]{0,80}?\bcore_pattern\b'
    category: info-leak
    severity_hint: medium
    scope: any
    vendor: generic
    rationale: '시스템 로그(syslogd -O)나 코어 덤프(core_pattern)를 SD 카드에 쓴다. 카드를 뽑으면 자격증명·장치 식별자가 샌다(Wyze 카드 로그 사례). fw_sd_surface SD-06.'
    references: []

function_heuristics:
  - id: fn-command-exec
    category: command-injection
    severity_hint: high
    pattern_class: P11
    functions: [system, popen, execl, execle, execlp, execv, execve, execvp, execvpe, posix_spawn, posix_spawnp]
    wrapper_name_regex: '(?i)(?:^|_)(?:do_?)?(?:system|shell|run_?cmd|exec_?cmd|cmd_?exec)(?:_|$)'
    what_to_check: '요청 핸들러(HTTP, CGI, DVRIP/DHIP, 업그레이드 파서)에서 이 함수들까지 가는 경로를 찾는다. 인자가 요청 값으로 만든 문자열인지, 사이에 화이트리스트나 메타문자 필터가 있는지 확인.'
    rationale: '설정값 -> 셸 싱크. 업그레이드 Script -> system()은 VulnCheck 디컴파일, Foscam devMng system()/popen()은 VDOO.'
    references: [CVE-2021-36260, CVE-2022-45045, CVE-2018-6831, CVE-2024-8957, CVE-2020-25079]
  - id: fn-command-build
    category: command-injection
    severity_hint: high
    pattern_class: P11
    functions: [sprintf, snprintf, vsprintf, vsnprintf, asprintf, strcat, strncat]
    what_to_check: '출력 버퍼가 fn-command-exec 인자로 흐르는지, 포맷 인자에 요청 유래 값(파일명, NTP 서버, 언어 코드, NIC 이름)이 들어가는지.'
    rationale: 'png2bmp 파일명(Kojenov), language 값(CVE-2021-36260, 싱크는 추정), tcpdump NIC 이름(bashis Uniview).'
    references: [CVE-2021-36260, CVE-2020-24217]
  - id: fn-unsafe-copy
    category: memory-safety
    severity_hint: high
    pattern_class: P12
    functions: [strcpy, stpcpy, strcat, sprintf, vsprintf, gets, memcpy, strncpy, wcscpy]
    what_to_check: 'URI, 헤더(CSeq, Range, Authorization), 로그인 username/password, base64 디코드 결과를 고정 크기 스택이나 전역 버퍼로 복사하는 호출. 바이너리 NX, 카나리, PIE 상태도 함께 기록.'
    rationale: 'strcpy 로그인 필드(VulnCheck, CVE-2018-10088), long URI -> sprintf(CVE-2022-45460), CSeq -> sprintf(CVE-2020-24214), password 길이 무검증(CVE-2017-3223), RTSP 헤더(CVE-2013-4977, CVE-2014-4880).'
    references: [CVE-2018-10088, CVE-2022-45460, CVE-2020-24214, CVE-2017-3223, CVE-2013-4977, CVE-2014-4880, CVE-2017-16725]
  - id: fn-unbounded-scanf
    category: memory-safety
    severity_hint: high
    pattern_class: P12
    functions: [sscanf, fscanf, scanf, vsscanf, vfscanf]
    format_regex: '%(?![0-9*])(?:s|\[)'
    what_to_check: '포맷 문자열에 폭 지정 없는 %s나 %[ 가 있고 목적지가 스택 버퍼인 호출.'
    rationale: 'Uniview /program/bin/maintain: __isoc99_sscanf(param_3 + local_1c + 2, "%[^:]:%hu", auStack336, &local_3a)(SSD 디컴파일).'
    references: [CVE-2021-45039]
  - id: fn-auth-literal-compare
    category: auth-bypass
    severity_hint: high
    pattern_class: P4/P5
    functions: [strcmp, strncmp, strcasecmp, strncasecmp, memcmp, bcmp, strstr, strcasestr, 'std::string::compare', 'std::operator==']
    what_to_check: '인증·로그인 함수 안에서 한쪽 인자가 .rodata 문자열 상수이고 다른 쪽이 요청 값인 비교. 성공 시 정상 검증을 건너뛰는지, 파라미터 "존재"만으로 인증을 생략하는지, clientType/loginType 같은 요청 값 분기가 성공으로 직행하는지.'
    rationale: 'neworange88888888 리터럴(Kojenov), I0TO5Wv9(tothi), HikCGI auth 존재 시 인증 생략(Monte Crypto), NetKeyboard/Loopback 분기(bashis), anonymous 하드코딩(Core).'
    references: [CVE-2020-24215, CVE-2017-7921, CVE-2021-33044, CVE-2021-33045, CVE-2013-4976]
  - id: fn-login-hash-compare
    category: auth-bypass
    severity_hint: high
    pattern_class: P7
    functions: [MD5_Init, MD5_Update, MD5_Final, MD5, strcmp, strcasecmp, memcmp]
    what_to_check: '로그인 검증이 평문에서 다이제스트를 계산하는지, 저장 해시를 클라이언트 값과 직접 비교하는지(pass-the-hash). 서버 생성 일회성 난수(challenge)가 입력에 들어가는지.'
    rationale: 'Dahua Generation 2/3 pass-the-hash(bashis), MD5 Admin Hash 로그인(nullku7), Sofia가 해시를 비밀번호로 수락(tothi).'
    references: [CVE-2017-7927, CVE-2017-6343]
  - id: fn-uri-substring-match
    category: auth-bypass
    severity_hint: high
    pattern_class: P1
    functions: [strstr, strcasestr, strncmp, strncasecmp, memmem, strrchr, 'std::string::find']
    what_to_check: '인증 함수 호출보다 앞서 URI를 확장자나 접두사 리터럴과 비교해 무인증 경로(정적 파일, 업로드)로 분기하는 코드. 부분 문자열이 경로 어디에나 있어도 매칭되는지, 정규화 이전 원문에 대해 검사하는지, Content-Type(multipart/form-data)만으로 인증 전에 분기하는지.'
    rationale: 'find() 부분 문자열(Kojenov), /snapPic/ 검색(VDOO), .ini만 인증 오류(Pierre Kim), multipart가 인증 이전(Kojenov).'
    references: [CVE-2020-24219, CVE-2018-6830, CVE-2017-8225, CVE-2020-24217]
  - id: fn-path-ops-unnormalized
    category: path-traversal
    severity_hint: high
    pattern_class: P2
    functions: [open, open64, fopen, fopen64, opendir, stat, lstat, access, remove, unlink, rename, sendfile]
    what_to_check: '웹 루트와 URI를 문자열로 결합한 경로가 realpath 검증이나 .. 제거 없이 이 함수들로 전달되는지. 디렉터리 목록(Index of) 템플릿 존재 여부.'
    rationale: 'uc-httpd /mnt/web/../../(tothi), TVT GET /..(CVE-2019-20085), Foscam remove()(VDOO), mini_httpd.'
    references: [CVE-2017-7577, CVE-2019-20085, CVE-2018-6830, CVE-2020-24219, CVE-2018-18778]
  - id: fn-cgi-env-from-request
    category: command-injection
    severity_hint: high
    pattern_class: P11
    functions: [setenv, putenv, execve]
    what_to_check: 'CGI 실행 전 요청 파라미터 이름이나 값을 환경 변수로 설정할 때 LD_PRELOAD 등 위험 변수 필터가 있는지.'
    rationale: 'GoAhead cgiHandler 환경 변수 초기화(CVE-2017-17562).'
    references: [CVE-2017-17562]
  - id: fn-hardcoded-crypto-key
    category: crypto
    severity_hint: high
    pattern_class: P8/P10
    functions: [AES_set_decrypt_key, AES_set_encrypt_key, AES_ecb_encrypt, AES_decrypt, DES_set_key, DES_set_key_unchecked, DES_ecb_encrypt, DES_ecb3_encrypt, EVP_DecryptInit_ex, EVP_EncryptInit_ex, EVP_CipherInit_ex, mbedtls_aes_setkey_dec, mbedtls_aes_setkey_enc, mbedtls_des_setkey_dec, mbedtls_des3_set2key_dec]
    what_to_check: '키 인자가 상수 주소나 상수 문자열에서 파생되는지. 업데이트 경로에 서명 검증(RSA/ECDSA verify) 호출이 있는지와 호출 순서.'
    rationale: 'Hikvision 설정 정적 키(FD), XiongMai 9530 3DES 변형과 평문 PSK(Yarmak).'
    references: [CVE-2017-7923, CVE-2021-41506]
  - id: fn-debug-listener-ports
    category: debug-interface
    severity_hint: high
    pattern_class: P6
    functions: [socket, bind, listen, accept, recvfrom, htons]
    port_constants:
      '23': '0x0017'
      '787': '0x0313'
      '4567': '0x11D7'
      '5000': '0x1388'
      '6789': '0x1A85'
      '7788': '0x1E6C'
      '9527': '0x2537'
      '9530': '0x253A'
      '34567': '0x8707'
      '37777': '0x9391'
    what_to_check: 'bind()나 htons()에 위 상수(호스트 바이트 순서, 네트워크 순서면 바이트 반전)가 쓰이는 데몬과 recv 루프의 명령 문자열 비교. loopback 전용이어야 할 서비스가 0.0.0.0에 바인드되는지.'
    rationale: 'XiongMai 9527/9530(Yarmak, VulnCheck), Dahua 37777/5000/6789(Depth, bashis), TVT 4567, Uniview 7788, Herospeed 787.'
    references: [CVE-2020-22253, CVE-2021-41506, CVE-2021-45039, CVE-2013-6117]
  - id: fn-weak-token-generation
    category: session-token
    severity_hint: medium
    pattern_class: P7
    functions: [time, gettimeofday, rand, srand, random, srandom, rand_r]
    what_to_check: '세션 ID나 nonce를 time()/rand()로 만드는지, Digest nonce가 상수인지, WS-Security nonce 캐시와 Created 시간창 비교가 없는지, 로그인에 서버 challenge가 없어 재전송되는지.'
    rationale: 'ONVIF 재전송(Nozomi), 웹 로그인 재전송, MAC 파생 Cloud ID(SEC Consult), nonce="tick"(Kojenov).'
    references: [CVE-2022-30563, CVE-2022-30561, CVE-2018-17917]
  - id: fn-base64-auth-decode
    category: auth-bypass
    severity_hint: medium
    pattern_class: P4/P12
    functions: []
    wrapper_name_regex: '(?i)b(?:ase)?64_?decode'
    what_to_check: 'Authorization 헤더나 쿼리 파라미터의 base64 디코드 결과가 고정 버퍼로 복사되는지(오버플로), 디코드한 user:pass에서 비밀번호 비교를 생략하는지(사칭).'
    rationale: 'HikCGI auth 파라미터(Monte Crypto), TVT ConfigSyncProc Base64 Authorization 스택 오버플로(bashis 2018, CVE 미확인).'
    references: [CVE-2017-7921]

notes:
  - '검증일 2026-10-18. CVE 사실은 CVE.org 레코드와 NVD API 2.0으로, KEV 여부는 CISA KEV feed catalogVersion 2026.10.16으로 확인. 사람이 읽는 근거와 해설은 docs/references/cctv-vuln-patterns.md.'
  - '정규식 방언: Python re. 기본 대소문자 구분, (?i)가 붙은 패턴만 무시. ASCII 기준으로 작성. 컴파일 시 re.MULTILINE 권장(^, $를 줄 단위로).'
  - 'scope 의미: strings = 바이너리에서 추출한 인쇄 가능 ASCII 문자열(strings -n 4 상당)의 각 줄; text = 텍스트 파일(스크립트, 설정, JS, HTML)의 각 줄; raw = 파일 전체 바이트를 latin-1로 디코드한 문자열(또는 pattern.encode("latin-1")로 만든 bytes 정규식), \xHH 이스케이프 사용; any = strings + text.'
  - 'credential_patterns.files와 interesting_paths는 추출된 rootfs 루트 기준 상대 POSIX glob. * 는 한 경로 요소 안, ** 는 0개 이상 디렉터리(pathlib.Path.glob / glob.glob(recursive=True) 의미). 선행 / 는 쓰지 않는다.'
  - 'severity_hint 어휘: critical(공개 백도어나 하드코딩 비밀번호와 정확히 일치), high(무인증 경로나 고위험 싱크의 강한 앵커), medium(조사 필요 앵커), low(오탐 많은 키워드), info(위치 파악용 앵커). 히트는 확정이 아니므로 REA(search_strings -> xrefs -> procedure_pseudo_code)로 확인한 뒤 finding으로 승격.'
  - 'string_heuristics.category는 auth-bypass, backdoor, hardcoded-credential, command-injection, debug-interface, crypto, info-leak 중 하나. credential_patterns도 같은 어휘. function_heuristics.category는 여기에 memory-safety, path-traversal, session-token을 더해 쓴다. pattern_class는 cctv-vuln-patterns.md 5절 P1-P12.'
  - 'references는 검증된 CVE ID만 담는다. 검증된 CVE가 없으면 빈 목록이고, 원문 URL을 rationale에 적었다.'
  - 'case-mcp 연동: finding.schema.json의 category와 매핑할 때 crypto -> weak-crypto(업데이트 무결성은 insecure-update), memory-safety -> memory-corruption, path-traversal -> info-leak(또는 auth-bypass), session-token -> auth-bypass(또는 weak-crypto), 빈 기본 비밀번호 -> insecure-default. 나머지는 같은 이름. severity_hint 어휘는 finding.severity와 동일.'
  - 'auth-hunt.schema.json의 vendor_family 매핑: web_server_binaries의 hikvision -> hikvision-like, dahua -> dahua-like, xiongmai -> xiongmai-like, hisilicon_video_encoder -> hisilicon-oem, 그 외 -> generic. checks[].id에는 이 파일의 휴리스틱 id를 그대로 쓸 수 있다.'
  - 'web_server_binaries는 웹 서버뿐 아니라 네트워크 대면 메인 앱과 데몬 이름을 포함. hikvision의 davinci와 centaurus는 커뮤니티(IPCamTalk) 출처로 1차 확인 불가. NVMS9000과 TelnetSwitch는 프로세스·데몬 이름이며 실제 파일명은 미확인.'
  - '서버 배너와 핑거프린트(벤더 식별 보조, 취약점 아님): "Server: App-webs/" = Hikvision IP camera httpd, "Server: Hikvision-Webs" = Hikvision DVR/camera httpd, "Server: DNVRS-Webs" = Hikvision NVR(nmap-service-probes); "Server: uc-httpd 1.0.0" = XiongMai Sofia HTTP(tothi 응답 원문, VulnCheck); RTSP "Server: H264DVR <ver>" = XiongMai RTSP(nmap-service-probes 규칙. VulnCheck가 인용한 "H264DVR rtspd 1.0"은 nmap 표시명(product H264DVR rtspd + version)이지 펌웨어/응답 문자열이 아니다. tothi의 nmap은 같은 계열의 554를 "LuxVision or Vacron DVR rtspd"로 표시했으므로 펌웨어마다 다를 수 있다); "Server: box", "Welcome to HiLinux." = HiSilicon 인코더(Kojenov), 인코더 RTSP 응답 "Server: Server Version 9.0.6"(Kojenov); "Server: GoAhead-Webs", "Server: GoAhead-Webs/<ver>", "Server: mini_httpd/<ver>"(nmap-service-probes); "Server: GoAhead-http"(현행 Embedthis GoAhead 소스 src/http.c, 버전 없음).'
  - '포트 지표: Dahua 37777/37778(DVRIP), 5000(DHIP), 37810/udp(탐색), 6789(구 디버그); XiongMai 80, 554, 9527(콘솔), 9530(OpenTelnet), 34567(+34599, 34568/udp, 34569/udp), 2021 펌웨어 23000/30100; HiSilicon 인코더 23, 80, 8086, 554, 8554, 1935, 5150(remserial), 9588(nginx); TVT 80 -> 4567; Uniview 7788/udp; WIFICAM 23, 10554; Foscam 88; Herospeed 787.'
  - '정정 1: CVE-2020-24214부터 24219까지는 Kojenov의 hi3520d 비디오 인코더(URayTech 등) 취약점이며, CERT VU#896979는 HiSilicon을 Not Affected로 분류. Yarmak의 9530 백도어는 CVE-2020-22253과 CVE-2021-41506(Xiongmai 소프트웨어).'
  - '정정 2: CVE-2017-16725(NetSurveillance Web)와 CVE-2018-10088(uc-httpd)은 버퍼 오버플로이며 하드코딩 자격증명 CVE가 아니다.'
  - '정정 3: SEC Consult SA-20181009-0은 CVE-2018-17915와 17917의 설명이 서로 바뀌어 있다. CVE/NVD/ICSA-18-282-06 기준으로 17915 = 암호화 누락(CWE-311), 17917 = MAC 기반 Cloud ID 예측(CWE-341).'
  - 'Hikvision 설정 AES 키 279977f62f6cfd2d91cd75b889ce0c9a와 XOR 키 73 8B 55 44는 제3자 복호화 도구(WormChickenWizard, chrisjd20)에서 확인한 값이다. 벤더 독립적인 1차 사실은 FD의 "static encryption key, which is derived from the password abcdefg"뿐이다. XOR 4바이트 키는 오탐이 많아 raw 시그니처로 넣지 않았다.'
  - '이 파일에는 exploit payload, 요청 본문, 매직 파라미터가 포함된 URL, 쿠키 값이 없다. 패턴은 펌웨어 쪽 지표(문자열, 핸들러 이름, 비교 상수, 키 상수, 경로)만 대상으로 한다.'
