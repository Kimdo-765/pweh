string_heuristics:
  # ---------------- Hikvision ----------------
  - id: hik-handler-families
    pattern: '/(?:ISAPI|PSIA|SDK)/[A-Za-z]'
    category: auth-bypass
    severity_hint: info
    scope: any
    vendor: hikvision
    rationale: 'Hikvision API 핸들러 계열(ISAPI, PSIA, HikCGI, Genetec) 위치 앵커. 핸들러 간 인증 코드 비대칭(한 곳에만 존재하면 인증 생략 분기)이 CVE-2017-7921의 핵심.'
    references: [CVE-2017-7921]
  - id: hik-hikcgi-endpoints
    pattern: '/(?:Security/users|System/configurationFile|onvif-http/snapshot)\b'
    category: auth-bypass
    severity_hint: medium
    scope: any
    vendor: hikvision
    rationale: 'Monte Crypto FD가 예시한 HikCGI 엔드포인트. xref로 HikCGI 디스패처와 쿼리 파라미터 auth 처리(비밀번호 무시) 여부를 확인.'
    references: [CVE-2017-7921]
  - id: hik-sdk-weblanguage
    pattern: '(?:/SDK/)?webLanguage\b'
    category: command-injection
    severity_hint: high
    scope: any
    vendor: hikvision
    rationale: '/SDK/webLanguage(PUT, XML language 요소). language 값이 셸에서 평가됨(공개 PoC 동작). 정확한 싱크는 (추정): sprintf류 -> system/popen류.'
    references: [CVE-2021-36260]
  - id: hik-psia-configurationdata
    pattern: '/PSIA/System/ConfigurationData\b'
    category: info-leak
    severity_hint: high
    scope: any
    vendor: hikvision
    rationale: '저권한 계정이 설정 데이터(4바이트 반복 XOR)를 받아 admin 비밀번호 획득(Core CORE-2013-0708).'
    references: [CVE-2013-4975]
  - id: hik-configurationfile
    pattern: '\bconfigurationFile\b'
    category: info-leak
    severity_hint: medium
    scope: any
    vendor: hikvision
    rationale: '설정 백업 export. 사용자명과 평문 비밀번호 포함, 정적 키 암호화(FD: derived from the password "abcdefg").'
    references: [CVE-2017-7923]
  - id: hik-anonymous-hardcoded
    pattern: 'anonymous:(?:\\177){6}'
    category: hardcoded-credential
    severity_hint: critical
    scope: any
    vendor: hikvision
    rationale: '하드코딩 anonymous 자격증명. 백슬래시+177 여섯 번이 문자 그대로 들어간 ASCII 텍스트(34바이트 anonymous:\177\177\177\177\177\177)에 매칭. Core CORE-2013-0708: login.js DoLogin()의 리터럴이며, Core가 제시한 쿠키 값도 base64 디코드하면 이 34바이트 텍스트다(0x7F 바이트 아님). Core는 "several references to those hardcoded credentials in the cgis"라고 썼으므로 바이너리(strings)도 검사한다(scope any).'
    references: [CVE-2013-4976]
  - id: hik-anonymous-hardcoded-raw
    pattern: 'anonymous:\x7f{6}'
    category: hardcoded-credential
    severity_hint: high
    scope: raw
    vendor: hikvision
    rationale: '같은 자격증명이 바이너리에 실제 0x7F(DEL) 바이트로 저장된 경우를 가정한 패턴(미확인). 1차 출처(Core)의 쿠키 값은 백슬래시 텍스트 형태이므로 hik-anonymous-hardcoded가 우선.'
    references: [CVE-2013-4976]
  - id: hik-config-aes-key-raw
    pattern: '\x27\x99\x77\xf6\x2f\x6c\xfd\x2d\x91\xcd\x75\xb8\x89\xce\x0c\x9a'
    category: crypto
    severity_hint: high
    scope: raw
    vendor: hikvision
    rationale: '설정 백업 복호화용 AES-128-ECB 키(제3자 복호화 도구 기준, 벤더 미확인). 히트 시 xref로 export/import 루틴 확인.'
    references: [CVE-2017-7923]
  - id: hik-config-aes-key-hex
    pattern: '(?i)279977f62f6cfd2d91cd75b889ce0c9a'
    category: crypto
    severity_hint: high
    scope: any
    vendor: hikvision
    rationale: '같은 키가 hex 문자열로 저장된 경우.'
    references: [CVE-2017-7923]

  # ---------------- Dahua ----------------
  - id: dh-login-netkeyboard
    pattern: '\bNetKeyboard\b'
    category: auth-bypass
    severity_hint: medium
    scope: any
    vendor: dahua
    rationale: 'global.login의 clientType NetKeyboard 분기. 기능 미지원 장비에서 비밀번호 검증 없이 성공하는지 디컴파일로 확인.'
    references: [CVE-2021-33044]
  - id: dh-login-loopback-local
    pattern: '\bLoopback\b'
    category: auth-bypass
    severity_hint: low
    scope: any
    vendor: dahua
    rationale: 'loginType Loopback(+ clientType Local, 클라이언트가 쓴 ipAddr 127.0.0.1) 신뢰 분기. 일반 단어이므로 dh-login-fields와 같은 바이너리에서 날 때만 의미.'
    references: [CVE-2021-33045]
  - id: dh-login-fields
    pattern: '\b(?:clientType|loginType|authorityType|passwordType)\b'
    category: auth-bypass
    severity_hint: info
    scope: any
    vendor: dahua
    rationale: 'Dahua 로그인 분기 키. 값마다 검증 경로를 표로 작성(cctv-vuln-patterns.md 3.2).'
    references: [CVE-2021-33044, CVE-2021-33045]
  - id: dh-rpc2-endpoints
    pattern: '/RPC2(?:_Login)?\b|\bglobal\.login\b'
    category: auth-bypass
    severity_hint: info
    scope: any
    vendor: dahua
    rationale: 'JSON-RPC 로그인 진입점(HTTP /RPC2_Login, DHIP 공용 로직).'
    references: [CVE-2021-33044, CVE-2021-33045]
  - id: dh-current-config
    pattern: '/current_config/'
    category: info-leak
    severity_hint: high
    scope: any
    vendor: dahua
    rationale: '/current_config/ <-> /mnt/mtd/Config/ 매핑. 사용자 DB(passwd, Account1) 무인증 다운로드와 pass-the-hash(bashis 2017, ICSA-17-124-02).'
    references: [CVE-2017-7925, CVE-2017-7927]
  - id: dh-public-config-allowlist
    pattern: '\b(?:WebCapConfig|preLanguage)\b'
    category: auth-bypass
    severity_hint: low
    scope: any
    vendor: dahua
    rationale: '의도적 공개 파일. 응급 수정이 이 두 파일만 허용하는 하드코딩 allowlist였음(bashis). 같은 디렉터리의 민감 파일 노출 여부 확인.'
    references: [CVE-2017-7925]
  - id: dh-loginex-js
    pattern: '\bloginEx\.js\b'
    category: auth-bypass
    severity_hint: info
    scope: any
    vendor: dahua
    rationale: '888888 계정의 로컬 전용 제한이 클라이언트 JS에서만 검사됨(bashis PoC 주석, CVE 미확인): https://github.com/mcw0/PoC/blob/master/dahua-backdoor-PoC.py'
    references: []
  - id: dh-videotalk
    pattern: '/videotalk\b'
    category: auth-bypass
    severity_hint: medium
    scope: any
    vendor: dahua
    rationale: '인증 없는 /videotalk HTTP 엔드포인트(Tenable TRA-2019-36).'
    references: [CVE-2019-3948]

