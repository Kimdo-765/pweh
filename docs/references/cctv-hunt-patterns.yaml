# vendor -> 바이너리 이름 목록 (rootfs에서 파일명 일치로 찾는다). 웹 서버뿐 아니라 네트워크 대면 메인 앱·데몬 포함.
web_server_binaries:
  hikvision:
    - 'davinci'        # (커뮤니티) IPCamTalk: 메인 앱 겸 웹 서버
    - 'centaurus'      # (커뮤니티) 일부 최신 HiWatch 펌웨어에서 davinci 대체
  dahua:
    - 'sonia'          # CERT/CC VU#547255: /usr/bin/sonia = web interface and other services
    - 'Challenge'      # bashis 2017 PoC 주석: Dahua main binaries 'Challenge' / 'Sonia'
  xiongmai:
    - 'Sofia'          # tothi: /var/Sofia (HTTP uc-httpd, RTSP, 34567 포함)
    - 'dvrHelper'      # Yarmak/VulnCheck: 9527(2016), 9530 백도어 스레드
    - 'macGuarder'     # Yarmak/VulnCheck: 9530 백도어
  hisilicon_video_encoder:
    - 'box.v400_hdmi'  # Kojenov: 장비마다 이름이 다를 수 있음(box.*)
  tvt:
    - 'NVMS9000'       # bashis 2018: TCP/4567 백엔드 프로세스 이름(실제 파일명 미확인)
    - 'ConfigSyncProc' # bashis 2018: /mnt/mtd/ConfigSyncProc, TCP/80 -> TCP/4567 HTTP wrapper
  uniview:
    - 'main-cgi'       # bashis 2017: /cgi-bin/main-cgi
    - 'maintain'       # SSD: /program/bin/maintain (UDP 7788)
  foscam:
    - 'lighttpd'
    - 'CGIProxy.fcgi'
    - 'webService'
    - 'devMng'
  herospeed:
    - 'TelnetSwitch'   # bashis 2018: TCP/787 (실제 파일명 미확인)
  generic:
    - 'boa'
    - 'goahead'
    - 'lighttpd'
    - 'thttpd'
    - 'mini_httpd'
    - 'uhttpd'
    - 'httpd'
    - 'nginx'

# 추출된 rootfs 루트 기준 상대 glob (POSIX, '**' = 0개 이상 디렉터리; pathlib.Path.glob 의미)
